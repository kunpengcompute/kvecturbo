name: pr ut

on:
  workflow_call:
    inputs:
      CP_DOCKER_IMG:
        required: true
        type: string
      pr_id:
        required: true
        type: string
      runs_on_arch:
        required: false
        type: string
        default: "arm"
      target_branch:
        required: true
        type: string
jobs:
  JOB_UT:
    name: ut
    select: selected_by_default
    needs: [ ]
    runs-on: [ self-hosted, os=euler, arch=arm64, type=pr, flavor=medium ]
    container:
      image: ${{ inputs.CP_DOCKER_IMG }}
      # options: --user root

    steps:
      - name: Checkout repository with pre merge
        uses: checkout
        with:
          repository: ${{atomgit.repositoryurl}}
          allow-unsafe-pr-checkout: true
          ref: refs/merge-requests/${{ inputs.pr_id }}/merge

      - name: Execute_shell
        id: exec_shell_step
        run: |-
            set -ex
            lcov --version
            export BINARYLIBS=/opt/buildtools/binarylibs/openGauss-third_party_binarylibs_openEuler_2203_arm
            sh build.sh
            export LD_LIBRARY_PATH=${BINARYLIBS}/kernel/platform/Huawei_Secure_C/Dynamic_Lib/:$LD_LIBRARY_PATH 
            export LIBRARY_PATH=${BINARYLIBS}/kernel/platform/Huawei_Secure_C/Dynamic_Lib/:$LIBRARY_PATH
            export C_INCLUDE_PATH=${BINARYLIBS}/kernel/platform/Huawei_Secure_C/comm/include/:$C_INCLUDE_PATH 
            export CPLUS_INCLUDE_PATH=${BINARYLIBS}/kernel/platform/Huawei_Secure_C/comm/include/:$CPLUS_INCLUDE_PATH
            pushd test/ut_test
            sh test.sh
            popd
